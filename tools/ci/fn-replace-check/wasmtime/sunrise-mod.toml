id = "fnr_wasmtime"
name = "Function replacement check: a mod that links the game's wasmtime"
version = "0.1.0"
description = "fn-replace: [[native.mixin]] in a mod built against the game's one wasmtime"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
sunrise = "HEAD"
mixins = "MIXINS"

[[native.mixin]]
id = "head"
target = "sunrise_client::game::autosave::Game<'_>::on_tick_rate_changed"
kind = "HEAD"
helper = "src/mixins/head.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "&mut *self" }]
