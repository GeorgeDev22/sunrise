[package]
name = "sunrise-wasmtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The game's one wasmtime, named so a native mod can link it instead of bringing its own"

[dependencies]
# The only `wasmtime` dependency of the game's workspace: the wasm runtime and every native mod take it from here.
wasmtime = { version = "50", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "parallel-compilation", "pulley", "threads"] }

[lints]
workspace = true
