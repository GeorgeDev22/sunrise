ids = [
    "hook:enchant_effect",
    "hook:enchant_effect.attacker",
    "hook:enchant_effect.victim",
    "hook:enchant_effect.weapon",
    "type:EnchantEffectEvent.attacker",
    "type:EnchantEffectEvent.victim",
    "type:EnchantEffectEvent.weapon",
]
why = "enchant_effect version 2 fires for every landed melee hit whose attacker's main-hand weapon carries a mod's own minecraft:post_attack kind: a player's hit on a mob or another player, and an armed mob's hit on a mob or a player. It names the attacker and the victim as entity handles and supplies the enchanted weapon stack, so an effect no longer assumes the acting player is the attacker or that the victim is a mob."
migrate = "Read event.attacker for the entity that hit (a player or a mob) and event.weapon for the enchanted stack in its main hand, instead of reading the acting player. event.victim is now an EntityRef instead of a mob's u32 id: use event.victim.id() where the id is needed. Rebuild native mods against this SDK."
