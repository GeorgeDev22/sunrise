ids = ["handle:LevelRef::place_placed_feature", "type:PlaceFeatureRefusal"]
why = "Direct placed-feature placement has no top feature. Reaching a biome filter now returns PlaceFeatureRefusal::BiomeFilter instead of selecting biome-checked placement. Earlier modifiers that produce no positions still return Ok(false). The new refusal changes the Wire enum layout."
migrate = "Rebuild native and wasm mods against this SDK; wasm mods must rebuild for the changed Wire layout. Handle BiomeFilter when placing features whose modifiers can reach a biome filter."
