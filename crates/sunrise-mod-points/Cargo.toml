[package]
name = "sunrise-mod-points"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The game's injection points for mods that listen at them: typed function records and listener slots"

[lib]
name = "mod_points"

[features]
# Shared listener integration fixture only; never enabled by gameplay crates.
listener-fixture = ["sunrise-mod-api-gen/listener-fixture", "sunrise-engine-slots/listener-fixture"]
wasm-guest = ["sunrise-mod-api/wasm-guest", "sunrise-engine-slots/wasm-guest"]

[dependencies]
sunrise-mod-api = { path = "../sunrise-mod-api" }
sunrise-engine-slots = { path = "../sunrise-engine-slots" }
mod_call = { package = "sunrise-mod-call", path = "../sunrise-mod-call" }

[build-dependencies]
sunrise-mod-api-gen = { path = "../sunrise-mod-api-gen" }
syn = "2"

[dev-dependencies]
sunrise-mod-api = { path = "../sunrise-mod-api", features = ["testing"] }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }

# These call the places' dispatch themselves, so they need a build whose table has sites.
[[test]]
name = "registry"
required-features = ["listener-fixture"]

[[test]]
name = "replace"
required-features = ["listener-fixture"]

[[test]]
name = "order"
required-features = ["listener-fixture"]

[lints]
workspace = true
