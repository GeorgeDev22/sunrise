name: wasm-std-names
# The wasm std member built on Linux and on Windows must have the same import and export name lists: a wasm mod
# imports std's symbols by name, and cargo-sunrise-mod gives std units a host-free symbol disambiguator, so the two
# lists are expected to be identical. The daily run (daily.yml) calls this, and a
# hand dispatch on a branch can: never a push or pull request, since Windows needs GitHub's runners (platform legs run
# daily, owner 2026-11-13). Nothing is published.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to check (the daily run's)
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-std-names-${{ inputs.commit && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          # The runner the Nightly's Windows x64 build uses (game-build.yml).
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      # cargo-sunrise-mod builds wasm with the Rust it was built for: tools/ci/rust-version, read at compile time.
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm-std-names
          # Only a run of main's own head: a daily of an older commit (inputs.commit) must not fill main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' && (!inputs.commit || inputs.commit == github.sha) }}
      - run: cargo build --locked -p cargo-sunrise-mod
      # Outside the checkout, so the std member's project never sits inside the game's workspace.
      - name: Build the std member
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/target/debug/cargo-sunrise-mod" wasm-std "$RUNNER_TEMP/std-${{ matrix.name }}.wasm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-std-${{ matrix.name }}
          path: ${{ runner.temp }}/std-${{ matrix.name }}.wasm
          if-no-files-found: error
          retention-days: 7

  # Both lists are read on one machine with one Python, so only the members can differ.
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
          sparse-checkout: tools/wasm_names.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-std-*
          path: ${{ runner.temp }}/members
          merge-multiple: true
      - name: Linux's and Windows' std members have the same import and export names
        run: |
          cd "$RUNNER_TEMP/members"
          python3 "$GITHUB_WORKSPACE/tools/wasm_names.py" std-linux.wasm > linux.txt
          python3 "$GITHUB_WORKSPACE/tools/wasm_names.py" std-windows.wasm > windows.txt
          echo "linux $(wc -l < linux.txt) names, windows $(wc -l < windows.txt) names"
          if cmp -s std-linux.wasm std-windows.wasm; then echo 'The two members are byte-identical.'; fi
          if ! diff -u linux.txt windows.txt > names.diff; then
            echo "::error::the std member's import and export name lists differ between Linux and Windows: $(grep -c '^[-+][^-+]' names.diff) lines of the exact comparison"
            head -n 60 names.diff
            exit 1
          fi
