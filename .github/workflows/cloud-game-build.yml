name: cloud game build
# Builds sunrise-client and sunrise-ctl for Linux x86_64 (fast profile) on a GitHub-hosted runner, so a
# laptop can run the wire harnesses without compiling the game itself. Build only: no tests, no Mojang files,
# no secrets. Runs on pushes to cloud-build branches of a fork, or by hand.
on:
  push:
    branches: ['cloud-build', 'cloud-build/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-game-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: Room for target/ (the hosted image ships tools this build never uses)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-game-build
      - name: Build sunrise-client and sunrise-ctl
        run: cargo build --locked --profile fast -p sunrise-game -p sunrise-client-lib --bin sunrise-client --bin sunrise-ctl
      - name: Pack the two programs
        run: tar -C target/fast -czf sunrise-linux-x86_64-fast.tar.gz sunrise-client sunrise-ctl && ls -la sunrise-linux-x86_64-fast.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: sunrise-linux-x86_64-fast
          path: sunrise-linux-x86_64-fast.tar.gz
          retention-days: 7
