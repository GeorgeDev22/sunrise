name: lead fixes
# Fork only (#2689): builds the game on a GitHub-hosted runner, then runs the harnesses in tools/ci/cloud-parity.txt
# against it. The parity job fetches Mojang's files inside the job (tools/ci/wire_grim_fetch.py) and uploads only the
# harness reports; no secrets.
on:
  push:
    branches: ['lead-fixes']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lead-fixes
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: Room for target/ (the hosted image ships tools this build never uses)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-game-build
      - name: Build the game and its companion programs
        run: |
          cargo build --locked --profile fast -p sunrise-game -p sunrise-client-lib --bin sunrise-client --bin sunrise-ctl
          cargo build --locked --profile fast -p sunrise-prepare -p sunrise-server
      - name: The wasm standard library a developer install places beside the game
        run: cargo run --locked -p cargo-sunrise-mod -- wasm-std target/fast/sunrise-wasm-std.wasm
      - name: Pack the programs
        run: |
          tar -C target/fast -czf sunrise-linux-x86_64-fast.tar.gz \
            sunrise-client sunrise-ctl sunrise-prepare sunrise-server sunrise-wasm-std.wasm
          ls -la sunrise-linux-x86_64-fast.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: sunrise-linux-x86_64-fast
          path: sunrise-linux-x86_64-fast.tar.gz
          retention-days: 7


  unit:
    # The fix's unit tests and clippy, which the laptop never compiles.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt
      - name: Room for target/
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lava-unit
      - run: cargo fmt --all -- --check
      - name: Unit tests
        run: 'cargo test --locked -p sunrise-world --lib stepped_interpolation'
      - name: Game unit tests
        run: 'echo no game unit tests for this build'
      - name: Clippy
        run: cargo clippy --locked -p sunrise-client-lib -p sunrise-client --lib --tests -- -D warnings

  parity:
    # The harnesses in tools/ci/cloud-parity.txt, one per line, against the game built above.
    needs: game
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: X server, software OpenGL and Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xkb-utils xkb-data libgl1-mesa-dri \
            libegl1 libglx-mesa0 mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 \
            libasound2t64
      - uses: actions/download-artifact@v7
        with:
          name: sunrise-linux-x86_64-fast
          path: bin
      - name: Unpack Sunrise
        run: cd bin && tar -xzf sunrise-linux-x86_64-fast.tar.gz && rm sunrise-linux-x86_64-fast.tar.gz && ls -la
      - name: Game files from Mojang
        run: python3 tools/ci/wire_grim_fetch.py --mc "$RUNNER_TEMP/mc" --servers "$RUNNER_TEMP/servers"
      - name: Import vanilla and prepare Sunrise's resources
        run: |
          python3 tools/lab.py prepare --minecraft-dir "$RUNNER_TEMP/mc" --server-jar "$RUNNER_TEMP/servers/server.jar"
          bin/sunrise-prepare --minecraft-dir "$RUNNER_TEMP/mc" --server-jar "$RUNNER_TEMP/servers/server.jar" --root "$PWD"
      - name: Harnesses
        env:
          SUNRISE_NO_AUDIO: '1'
        run: |
          mkdir -p reports; status=0
          while read -r line; do
            [ -n "$line" ] || continue
            echo "::group::$line"
            python3 tools/ci/with_xvfb.py $line 2>&1 | tee -a reports/run.log; code=${PIPESTATUS[0]}
            echo "exit $code: $line" | tee -a reports/summary.txt; [ "$code" = 0 ] || status=1
            echo "::endgroup::"
          done < tools/ci/cloud-parity.txt
          for d in .local/*-parity; do [ -d "$d" ] && cp -r "$d" reports/; done
          find reports -type f \( -name '*.jar' -o -name '*.class' -o -name '*.png' -o -name '*.mca' -o -name '*.dat' \) -delete
          cat reports/summary.txt
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-reports
          path: reports
          retention-days: 7
