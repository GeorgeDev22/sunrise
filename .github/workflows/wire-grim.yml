name: wire grim run
# Wire parity item 93, on the fork only: the whole scenario list (tools/ci/wire-grim-scenarios.txt) played by the
# real vanilla 26.3 client and by Sunrise on Paper + Grim, once on Paper 26.3 and once on Paper 1.21.11 through
# ViaVersion, in parallel shards. Each shard uploads its captures, the server log and Grim's violation database.
# The game files come from Mojang inside the job (tools/ci/wire_grim_fetch.py) and never leave it: nothing of
# Mojang's is committed or uploaded. Sunrise is the "cloud game build" artifact named by SUNRISE_RUN.
on:
  push:
    branches: ['wire-grim']
  workflow_dispatch:
    inputs:
      list:
        description: 'Scenario list (default: SCENARIO_LIST below)'
        required: false
      options:
        description: 'WIRE_STREAM_OPTIONS for both clients (e.g. chatVisibility:2)'
        required: false
      sunrise_run:
        description: 'The game build run to play Sunrise from (default: SUNRISE_RUN below)'
        required: false
      shards:
        description: 'Shards per server and round (default: 2); give shard_list too'
        required: false
      shard_list:
        description: 'The shards as a JSON list, 0 .. shards-1 (default: [0, 1])'
        required: false
      rounds:
        description: 'Rounds, as a JSON list (default: [1, 2, 3])'
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: wire-grim-${{ github.event_name }}-${{ inputs.list }}-${{ inputs.options }}-${{ inputs.sunrise_run }}-${{ inputs.shards }}
  cancel-in-progress: true
env:
  # lead fixes 44381753743: main + every open fix PR (#2322 #2478 #2595 #2650 #2698 #2724 #2866 #2867 #2094) + #2689 + leads AM, AA, boat clamp.
  SUNRISE_RUN: ${{ inputs.sunrise_run || '44381753743' }}
  SHARDS: ${{ inputs.shards || '2' }}
  # The scenario list this run plays (tools/ci/wire-grim-scenarios.txt: all of item 93; wire-grim-audit-scenarios.txt:
  # what the Grim check audit found no scenario for).
  SCENARIO_LIST: ${{ inputs.list || 'tools/ci/wire-grim-audit-scenarios.txt' }}
  # Grim's experimental checks count too (tools/test_wire_stream_parity.py grim_experimental).
  WIRE_STREAM_GRIM_EXPERIMENTAL: '1'
  WIRE_STREAM_OPTIONS: ${{ inputs.options || '' }}
jobs:
  grim:
    name: ${{ matrix.anticheat }} ${{ matrix.server }} r${{ matrix.round }} s${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # grim or intave (Intave logs only: no kicks or bans; tools/test_wire_stream_parity.py intave_plugin).
        # grim, intave, or proxy (item 6: the vanilla server behind Velocity, a server switch at the end).
        anticheat: ['grim', 'intave']
        server: ['paper-26.3', 'via-1.21.11']
        # Three rounds of the whole list: a difference counts only when it comes back in each.
        round: ${{ fromJSON(inputs.rounds || '[1, 2, 3]') }}
        # 0 .. SHARDS-1 (the input shard_list, given with shards).
        shard: ${{ fromJSON(inputs.shard_list || '[0, 1]') }}
        # The proxy runs on the vanilla server: the ViaVersion half would repeat it.
        exclude:
          - anticheat: proxy
            server: via-1.21.11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: X server, software OpenGL and Vulkan
        run: |
          # A mirror's outage (2026-11-19: security.ubuntu.com 503s) failed 73 of 120 jobs: retry with backoff.
          source tools/ci/apt_retry.sh
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends xvfb xauth x11-xkb-utils xkb-data libgl1-mesa-dri \
            libegl1 libglx-mesa0 mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 \
            libasound2t64 sqlite3
      - name: Sunrise (cloud game build ${{ env.SUNRISE_RUN }})
        uses: actions/download-artifact@v4
        with:
          name: sunrise-linux-x86_64-fast
          run-id: ${{ env.SUNRISE_RUN }}
          github-token: ${{ github.token }}
          path: bin
      - name: Unpack Sunrise
        run: |
          cd bin
          for t in *.tar.gz; do [ -e "$t" ] && tar -xzf "$t" && rm "$t"; done
          find . -maxdepth 2 -type f | head -20
          if [ ! -e sunrise-client ]; then mv */* . 2>/dev/null || true; fi
          chmod +x sunrise-client sunrise-ctl sunrise-prepare
          ls -la
      - name: Game and server files from their official sources
        run: python3 tools/ci/wire_grim_fetch.py --mc "$RUNNER_TEMP/mc" --servers "$RUNNER_TEMP/servers"
      - name: Import vanilla and prepare Sunrise's resources
        run: |
          python3 tools/lab.py prepare --minecraft-dir "$RUNNER_TEMP/mc" --server-jar "$RUNNER_TEMP/servers/server.jar"
          bin/sunrise-prepare --minecraft-dir "$RUNNER_TEMP/mc" --server-jar "$RUNNER_TEMP/servers/server.jar" \
            --root "$PWD"
          ls .local .local/sunrise-client
      - name: Scenarios of this shard
        id: shard
        run: |
          list=$(python3 -c "import sys;n=[l.strip() for l in open('$SCENARIO_LIST') if l.strip()];print(','.join(n[${{ matrix.shard }}::$SHARDS]))")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list" | tr ',' '\n' | wc -l
      - name: Both clients through Grim
        env:
          SUNRISE_NO_AUDIO: '1'
          SUNRISE_LAUNCHER_NO_SELF_UPDATE: '1'
          WIRE_STREAM_GRIM: ${{ runner.temp }}/servers
          WIRE_STREAM_VIA: ${{ matrix.server == 'via-1.21.11' && '1.21.11' || '' }}
          WIRE_STREAM_ANTICHEAT: ${{ matrix.anticheat }}
          # A small vanilla window, so its CPU-drawn frames stay under a tick (even ticks, as on real hardware).
          WIRE_STREAM_VANILLA_SIZE: 256x144
        run: |
          [ -n "$WIRE_STREAM_VIA" ] || unset WIRE_STREAM_VIA
          # anticheat 'proxy' (item 6): the vanilla server, no anticheat, behind Velocity, and a server switch after
          # the scenarios.
          if [ "$WIRE_STREAM_ANTICHEAT" = proxy ]; then
            export WIRE_STREAM_PROXY="$WIRE_STREAM_GRIM"
            unset WIRE_STREAM_GRIM WIRE_STREAM_ANTICHEAT WIRE_STREAM_VIA
          fi
          set +e
          python3 tools/ci/with_xvfb.py python3 tools/test_wire_stream_parity.py --bin bin --out out \
            --scenarios "${{ steps.shard.outputs.list }}" --keep 2>&1 | tee run.log
          echo "harness exit: ${PIPESTATUS[0]}" | tee -a run.log
          mkdir -p out && cp run.log out/
          # Sunrise's own game log (the harness keeps its scratch with --keep), for a launch that fails.
          for log in /tmp/hz-wire-stream-*/*/c.log; do [ -e "$log" ] && cp "$log" "out/sunrise-$(basename "$(dirname "$log")")-c.log"; done
          exit 0
      - name: No Mojang files in the upload, captures compressed
        run: |
          find out -type f \( -name '*.jar' -o -name '*.class' -o -name '*.ogg' -o -name '*.png' \) -print -delete
          # The packet captures shrink about 60 times with xz, which keeps the downloads under GitHub's egress limit.
          find out -name '*.jsonl' -exec xz -6 -T0 {} +
          du -sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.anticheat }}-${{ matrix.server }}-r${{ matrix.round }}-${{ matrix.shard }}
          path: out
          retention-days: 7
          if-no-files-found: warn
