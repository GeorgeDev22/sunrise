name: cloud check
# Checks a mod API change on GitHub's hosted runners (free on this public fork): rustfmt, clippy, the unit tests of
# the crates it touches, and the sunrise-client lib test binary, uploaded so its daily tests can run against prepared
# data elsewhere. Build only: no Mojang files, no secrets. Runs on pushes to cloud-check branches of a fork.
on:
  push:
    branches: ['cloud-check/**']
permissions:
  contents: read
concurrency:
  group: cloud-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt
      - name: Room for target/ (the hosted image ships tools this build never uses)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-game-tests
          cache-on-failure: true
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: The lib test binary
        run: |
          cargo test --locked -p sunrise-client --lib --no-run --message-format=json > tests.json
          mkdir -p testbin
          python3 -c "import json,shutil;[shutil.copy(m['executable'],'testbin/'+m['target']['name']+'-'+m['target']['kind'][0]) for m in map(json.loads,open('tests.json')) if m.get('reason')=='compiler-artifact' and m.get('profile',{}).get('test') and m.get('executable')]"
          ls -la testbin
          tar -czf sunrise-client-lib-tests.tar.gz testbin
      - uses: actions/upload-artifact@v7
        with:
          name: sunrise-client-lib-tests
          path: sunrise-client-lib-tests.tar.gz
          retention-days: 3
      - name: Clippy
        run: cargo clippy --locked -p sunrise-mod-vocab -p sunrise-world -p sunrise-mod-api-gen -p sunrise-client --lib --tests -- -D warnings
      - name: Unit tests of the touched crates
        run: |
          cargo test --locked -p sunrise-mod-vocab --lib
          cargo test --locked -p sunrise-world --lib
          cargo test --locked -p sunrise-mod-api-gen --lib
