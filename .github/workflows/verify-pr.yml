name: verify pr
# Fork only: one pull request's branch plus this commit, on GitHub-hosted runners. Runs each command in
# tools/ci/verify-pr.txt (unit tests, clippy, parity harnesses). Mojang's files come from Mojang inside the job
# (tools/ci/wire_grim_fetch.py). Harness logs hold vanilla data, so the public log shows only each command and its
# exit code; the reports are uploaded encrypted to tools/ci/fork-report-key.pem, whose private half never leaves
# the fork owner's machine.
on:
  push:
    branches: ['verify/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: wasm32-unknown-unknown
          components: rust-src, clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Room for the builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Libraries, X server, software OpenGL and Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev xvfb xauth x11-xkb-utils xkb-data \
            libgl1-mesa-dri libegl1 libglx-mesa0 mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libxcursor1 libxi6 \
            libxrandr2 libasound2t64
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-pr
          workspaces: '. -> target'
      - name: Game files from Mojang and the prepared resources
        run: |
          python3 tools/ci/wire_grim_fetch.py --mc "$RUNNER_TEMP/mc" --servers "$RUNNER_TEMP/servers" > "$RUNNER_TEMP/fetch.log" 2>&1 || { tail -5 "$RUNNER_TEMP/fetch.log"; exit 1; }
          python3 tools/lab.py prepare --minecraft-dir "$RUNNER_TEMP/mc" --server-jar "$RUNNER_TEMP/servers/server.jar" > "$RUNNER_TEMP/prepare.log" 2>&1 || { echo "lab prepare failed"; exit 1; }
          cargo build --locked --profile fast -p sunrise-prepare > "$RUNNER_TEMP/prepare-build.log" 2>&1 || { echo "sunrise-prepare build failed"; exit 1; }
          target/fast/sunrise-prepare --minecraft-dir "$RUNNER_TEMP/mc" --server-jar "$RUNNER_TEMP/servers/server.jar" --root "$PWD" > "$RUNNER_TEMP/sunrise-prepare.log" 2>&1 || { echo "sunrise-prepare failed"; exit 1; }
      - name: Commands (each one and its exit code only)
        env:
          SUNRISE_NO_AUDIO: '1'
          SUNRISE_TELEMETRY_URL: 'off'
        run: |
          mkdir -p reports; status=0; n=0
          while read -r line; do
            [ -n "$line" ] || continue
            n=$((n+1))
            bash -c "python3 tools/ci/with_xvfb.py $line" > "reports/cmd-$n.log" 2>&1; code=$?
            echo "exit $code: $line" | tee -a reports/summary.txt; [ "$code" = 0 ] || status=1
          done < tools/ci/verify-pr.txt
          cp "$RUNNER_TEMP"/*.log reports/ 2>/dev/null || true
          exit $status
      - name: Encrypt the reports
        if: always()
        run: |
          mkdir -p reports
          for d in .local/*-parity .local/parity-logs .local/parity .local/parity-runner/logs; do [ -d "$d" ] && cp -r "$d" reports/ 2>/dev/null; done
          find reports -type f \( -name '*.jar' -o -name '*.class' -o -name '*.ogg' -o -name '*.png' -o -name '*.mca' \) -delete
          tar -cJf reports.tar.xz reports
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in reports.tar.xz -out reports.tar.xz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey tools/ci/fork-report-key.pem -pkeyopt rsa_padding_mode:oaep -in key.bin -out key.bin.enc
          mkdir upload && mv reports.tar.xz.enc key.bin.enc upload/ && rm -f key.bin reports.tar.xz && rm -rf reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-reports
          path: upload
          retention-days: 7
